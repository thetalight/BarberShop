[project]
name = "elevator-zero"
version = "0.1.0"
requires-python = ">=3.11"
description = "Local story and video studio for Elevator Zero English shorts"

[project.scripts]
elevator = "elevator.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["elevator*"]
