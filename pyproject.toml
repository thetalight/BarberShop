[project]
name = "xiangwei-barber-shop"
version = "0.1.0"
requires-python = ">=3.11"
description = "Local production pipeline for the Xiangwei human barber series"

[project.scripts]
barber = "barber.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["barber*"]
