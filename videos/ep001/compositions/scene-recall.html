<!doctype html><html lang="en"><body><template>
<style>#scene-recall-root{position:absolute;inset:0;width:100%;height:100%;overflow:hidden;background:#251f18}
#scene-recall-root img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform-origin:50% 50%}
#scene-recall-root img:first-child{opacity:1}</style>
<div id="scene-recall-root" data-composition-id="scene-recall" data-width="1080" data-height="1920" data-duration="9.000" data-layout-allow-overflow><img id="scene-recall-shot-0" src="../assets/takes/bc0be07911c0-dad_points_chair_v1.jpg" alt="recall 1"></div>
<script>(function(){const poses=[{"at": 0, "scale": 1.035, "x": 0.0, "y": 0.0}],tl=gsap.timeline({paused:true});
poses.forEach((p,i)=>{const id="#scene-recall-shot-"+i;const until=i+1<poses.length?poses[i+1].at:9.000;
tl.fromTo(id,{scale:p.scale,x:p.x,y:p.y},{scale:p.scale+.01,x:p.x+2,y:p.y-2,duration:Math.max(.1,until-p.at),ease:"sine.inOut",immediateRender:false},p.at);
if(i){tl.set("#scene-recall-shot-"+(i-1),{opacity:0},p.at);tl.set(id,{opacity:1},p.at);}});
window.__timelines["scene-recall"]=tl;})();</script></template></body></html>
