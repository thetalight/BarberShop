<!doctype html><html lang="en"><body><template>
<style>
#scene-call-root{position:absolute;inset:0;width:100%;height:100%;overflow:hidden;background:#251f18}
#scene-call-root img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform-origin:50% 50%;will-change:transform,opacity}
#scene-call-root img:first-child{opacity:1}
</style>
<div id="scene-call-root" data-composition-id="scene-call" data-width="1080" data-height="1920" data-duration="5.876" data-layout-allow-overflow><img id="scene-call-shot-0" src="assets/stills/04_miller_calls-right-hand.jpg" alt="call shot 1">
<img id="scene-call-shot-1" src="assets/stills/04_daughter_reacts-right-hand.jpg" alt="call shot 2"></div>
<script>(function(){
const poses=[{"at": 0, "scale": 1.35, "x": 15, "y": 325}, {"at": 3.491, "scale": 1.03, "x": 0, "y": 0}], tl=gsap.timeline({paused:true});
poses.forEach((p,i)=>{
 const id="#scene-call-shot-"+i;
 const until=i+1<poses.length?poses[i+1].at:5.876;
 tl.fromTo(id,{scale:p.scale,x:p.x,y:p.y},{scale:p.scale+.012,x:p.x+3,y:p.y-3,duration:Math.max(.1,until-p.at),ease:"sine.inOut",immediateRender:false},p.at);
 if(i){tl.set("#scene-call-shot-"+(i-1),{opacity:0},p.at);tl.set(id,{opacity:1},p.at);}
});
window.__timelines["scene-call"]=tl;
})();</script></template></body></html>
